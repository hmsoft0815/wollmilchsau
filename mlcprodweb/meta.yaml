id: "wollmilchsau"
name: "Wollmilchsau"
version: "2.3.0"
status: "stable"
category: "Infrastructure"
license: "MIT"
platforms: [Windows, macOS, Linux]
slogan_en: "A high-performance TypeScript execution engine for MCP servers, powered by V8."
slogan_de: "Eine Hochleistungs-TypeScript-Engine für MCP-Server, basierend auf V8."

features:
  - icon: "cpu"
    title_en: "V8-Powered Performance"
    title_de: "V8-Power"
    desc_en: "Embeds the V8 JavaScript engine directly for near-native TypeScript execution."
    desc_de: "Bettet die V8-JavaScript-Engine direkt ein für eine nahezu native Performance."
  - icon: "box"
    title_en: "Zero Node.js dependency"
    title_de: "Kein Node.js erforderlich"
    desc_en: "Run TypeScript without a local Node.js or Deno installation."
    desc_de: "Führen Sie TypeScript ohne lokale Installation von Node.js oder Deno aus."
  - icon: "zap"
    title_en: "esbuild Integration"
    title_de: "esbuild-Integration"
    desc_en: "Blazing fast bundling and transpilation of TypeScript files on the fly."
    desc_de: "Herausragend schnelles Bundling und Transpilieren von TypeScript-Dateien."
  - icon: "shield-check"
    title_en: "Safe Execution"
    title_de: "Sichere Ausführung"
    desc_en: "Isolated script execution environment for secure MCP tool logic."
    desc_de: "Isolierte Ausführungsumgebung für sichere MCP-Tool-Logik."

downloads:
  free: true
  files:
    - os: "Linux"
      arch: "x64"
      label_en: "Linux (amd64)"
      label_de: "Linux (amd64)"
      file: "https://mlcgo.eu/downloads/wollmilchsau/wollmilchsau-linux-amd64.tar.gz"
    - os: "Windows"
      arch: "x64"
      label_en: "Windows (amd64)"
      label_de: "Windows (amd64)"
      file: "https://mlcgo.eu/downloads/wollmilchsau/wollmilchsau-windows-amd64.tar.gz"
    - os: "macOS"
      arch: "Universal"
      label_en: "macOS (Universal)"
      label_de: "macOS (Universal)"
      file: "https://mlcgo.eu/downloads/wollmilchsau/wollmilchsau-macos-universal.tar.gz"

spotlight_sections:
  - title_en: "High-Performance Architecture"
    title_de: "Hochleistungs-Architektur"
    desc_en: "By embedding V8 directly through CGO, Wollmilchsau avoids the overhead of inter-process communication. Your TypeScript logic runs in the same memory space as the server transport, enabling ultra-fast execution of MCP tools."
    desc_de: "Durch die direkte Einbettung von V8 via CGO vermeidet Wollmilchsau den Overhead der Inter-Prozess-Kommunikation. Ihre TypeScript-Logik läuft im selben Speicherbereich wie der Server-Transport."
    image: "https://mlcgo.eu/assets/wollmilchsau/architecture_v8.png"
    align: "left"
  - title_en: "TypeScript First"
    title_de: "TypeScript First"
    desc_en: "Leverage the full power of TypeScript and modern JavaScript features without any pre-build steps. Wollmilchsau uses esbuild to compile and bundle your script instantaneously upon request."
    desc_de: "Nutzen Sie die volle Power von TypeScript und modernen JavaScript-Features ohne vorherige Build-Schritte. Wollmilchsau nutzt esbuild, um Ihr Skript bei Bedarf sofort zu kompilieren."
    image: "https://mlcgo.eu/assets/wollmilchsau/typescript_integration.png"
    align: "right"
