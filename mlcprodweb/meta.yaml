id: "wollmilchsau"
name: "Wollmilchsau"
version: "2.3.0"
status: "stable"
category: "MCP Tools"
license: "MIT"
platforms: [Windows, macOS, Linux]
slogan_en: "Stop making the LLM think — give it a V8 sandbox and let it write code."
slogan_de: "Lass die KI nicht rechnen — gib ihr eine V8-Sandbox und lass sie Code schreiben."

screenshots:
  - "how_it_works.png"

spotlight_sections:
  - title_en: "The LLM Writes Code — Wollmilchsau Runs It"
    title_de: "Die KI schreibt Code — Wollmilchsau führt ihn aus"
    desc_en: "Instead of reasoning through data transformations step by step, the agent writes a small TypeScript program. Wollmilchsau runs it in an isolated V8 sandbox and returns a deterministic result in milliseconds."
    desc_de: "Anstatt Datentransformationen Schritt für Schritt durchzudenken, schreibt der Agent ein kleines TypeScript-Programm. Wollmilchsau führt es in einer isolierten V8-Sandbox aus und liefert in Millisekunden ein deterministisches Ergebnis."
    screenshot: "how_it_works.png"
    items_en:
      - "Self-correcting: errors with source maps are fed back to the agent"
      - "In-process esbuild — no subprocess overhead"
      - "Structured JSON output for reliable tool parsing"
    items_de:
      - "Selbstkorrigierend: Fehler mit Source Maps werden an den Agenten zurückgegeben"
      - "In-Process esbuild — kein Subprocess-Overhead"
      - "Strukturierter JSON-Output für zuverlässiges Tool-Parsing"

features:
  - icon: "cpu"
    title_en: "V8-Powered Performance"
    title_de: "V8-Power"
    desc_en: "Embeds the V8 JavaScript engine directly via CGO — near-native TypeScript execution in the same memory space."
    desc_de: "Bettet die V8-Engine direkt via CGO ein — nahezu native Ausführung im selben Speicherbereich."
  - icon: "shield-check"
    title_en: "Secure Sandbox"
    title_de: "Sichere Sandbox"
    desc_en: "No network, no filesystem, no Node.js APIs. Scripts run fully isolated with configurable timeouts."
    desc_de: "Kein Netzwerk, kein Dateisystem, keine Node.js APIs. Scripts laufen vollständig isoliert mit konfigurierbaren Timeouts."
  - icon: "zap"
    title_en: "Instant TypeScript"
    title_de: "Sofortiges TypeScript"
    desc_en: "In-process esbuild compiles and bundles TypeScript on the fly — no pre-build steps, no subprocess."
    desc_de: "In-Process esbuild kompiliert TypeScript on-the-fly — keine Build-Schritte, kein Subprocess."
  - icon: "map"
    title_en: "Source Maps"
    title_de: "Source Maps"
    desc_en: "Errors point to the exact TypeScript line. The agent can read, fix, and retry automatically."
    desc_de: "Fehler zeigen auf die genaue TypeScript-Zeile. Der Agent liest, korrigiert und wiederholt automatisch."
  - icon: "package"
    title_en: "Artifact Integration"
    title_de: "Artifact-Integration"
    desc_en: "Large outputs are automatically saved via openArtifact() — keeping tool responses lean."
    desc_de: "Große Ausgaben werden automatisch via openArtifact() gespeichert — Tool-Antworten bleiben schlank."
  - icon: "plug"
    title_en: "stdio + SSE Transport"
    title_de: "stdio + SSE Transport"
    desc_en: "Works locally with Claude Desktop (stdio) and remotely over SSE — one binary, both modes."
    desc_de: "Läuft lokal mit Claude Desktop (stdio) und remote über SSE — eine Binary, beide Modi."

downloads:
  free: true
  notices:
    - type: info
      en: "Requires a C compiler (gcc/clang) and V8 libraries for building from source."
      de: "Für den Selbst-Build werden ein C-Compiler (gcc/clang) sowie V8-Bibliotheken benötigt."
  files:
    - os: "Linux"
      arch: "x64"
      label_en: "Linux (amd64)"
      label_de: "Linux (amd64)"
      file: "https://mlcgo.eu/downloads/wollmilchsau/wollmilchsau-linux-amd64.tar.gz"
    - os: "Windows"
      arch: "x64"
      label_en: "Windows (amd64)"
      label_de: "Windows (amd64)"
      file: "https://mlcgo.eu/downloads/wollmilchsau/wollmilchsau-windows-amd64.tar.gz"
    - os: "macOS"
      arch: "Universal"
      label_en: "macOS (Universal)"
      label_de: "macOS (Universal)"
      file: "https://mlcgo.eu/downloads/wollmilchsau/wollmilchsau-macos-universal.tar.gz"
