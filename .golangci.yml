version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      disable:
        - fieldalignment
      enable-all: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        text: defer
      - linters:
          - errcheck
        text: os.RemoveAll
      - linters:
          - errcheck
        text: os.Remove
      - linters:
          - errcheck
        path: internal/executor/executor.go
      - linters:
          - errcheck
        path: internal/sourcemap/sourcemap_test.go
      - linters:
          - errcheck
        path: cmd/testclient/main.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
